name: Deploy to Production

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: people-supported-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy on EC2
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, linux, x64, production]

    steps:
      - name: Deploy application
        env:
          DEPLOY_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          cd /home/ubuntu/apps/people-supported
          bash deploy.sh
