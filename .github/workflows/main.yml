name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  code_lint:
    name: Code Lint
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/people_supported?schema=public
      AUDIT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/people_supported_audit?schema=public
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      JWT_SECRET: ci-dummy-jwt-secret-key-12345678
      STRICT_SECRET_CHECK: "false"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Main Prisma Client
        run: pnpm db:generate

      - name: Generate Audit Prisma Client
        run: pnpm --filter @repo/audit-db exec prisma generate --schema=prisma/schema.prisma

      - name: Build packages
        run: pnpm --filter "@repo/*" build

      - name: Lint
        run: pnpm run lint

  build:
    name: Build Check
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/people_supported?schema=public
      AUDIT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/people_supported_audit?schema=public
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      JWT_SECRET: ci-dummy-jwt-secret-key-12345678
      NEXT_PUBLIC_API_URL: http://localhost:4400/api
      STRICT_SECRET_CHECK: "false"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Main Prisma Client
        run: pnpm db:generate

      - name: Generate Audit Prisma Client
        run: pnpm --filter @repo/audit-db exec prisma generate --schema=prisma/schema.prisma

      - name: Build Project
        run: pnpm run build
